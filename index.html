<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bewerbungsunterlagen Generator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Adaptive Bewerbung</h1>
            <p class="subtitle">Anschreiben und Lebenslauf passend zur konkreten Stelle</p>
        </header>

        <main class="main-content">
            <section class="input-section">
                <h2>1. Master-CV</h2>
                <div class="file-upload">
                    <label for="masterCV" class="upload-label">
                        <span>Master-CV als JSON laden</span>
                        <input type="file" id="masterCV" accept=".json,application/json">
                    </label>
                    <button id="loadSample" class="btn-secondary" type="button">Beispiel laden</button>
                </div>
                <div id="cvStatus" class="status-message"></div>
            </section>

            <section class="input-section">
                <h2>2. Stellenanzeige</h2>
                <textarea
                    id="jobDescription"
                    placeholder="Hier den vollständigen Text der Stellenanzeige einfügen..."
                    rows="10"
                ></textarea>
            </section>

            <section class="input-section">
                <h2>3. Bewerbungsfoto</h2>
                <input type="file" id="userPhoto" accept="image/*">
                <label for="userPhoto" class="upload-label compact-upload">
                    <span>Foto laden oder gespeichertes Foto verwenden</span>
                </label>
                <div id="photoPreview"></div>
            </section>

            <div class="action-section">
                <button id="generateBtn" class="btn-primary" type="button">
                    Dokumente generieren
                </button>
            </div>

            <section id="outputSection" class="output-section" hidden>
                <div class="output-heading">
                    <div>
                        <h2>Generierte Dokumente</h2>
                        <p id="modelInfo" class="muted"></p>
                    </div>
                    <button id="clearLastApplication" class="btn-action" type="button">Cache löschen</button>
                </div>

                <div class="document-tabs">
                    <button class="tab-btn active" data-tab="anschreiben" type="button">Anschreiben</button>
                    <button class="tab-btn" data-tab="lebenslauf" type="button">Lebenslauf</button>
                    <button class="tab-btn" data-tab="check" type="button">Prüfung</button>
                </div>

                <div class="tab-content active" id="anschreiben-tab">
                    <div class="document-actions">
                        <button class="btn-action" id="printAnschreiben" type="button">Drucken / PDF</button>
                        <button class="btn-action" id="downloadAnschreiben" type="button">HTML speichern</button>
                    </div>
                    <iframe id="anschreibenPreview" class="document-frame" title="Anschreiben Vorschau"></iframe>
                </div>

                <div class="tab-content" id="lebenslauf-tab">
                    <div class="document-actions">
                        <button class="btn-action" id="printLebenslauf" type="button">Drucken / PDF</button>
                        <button class="btn-action" id="downloadLebenslauf" type="button">HTML speichern</button>
                    </div>
                    <iframe id="lebenslaufPreview" class="document-frame" title="Lebenslauf Vorschau"></iframe>
                </div>

                <div class="tab-content" id="check-tab">
                    <div class="quality-check">
                        <h3>Краткое содержание</h3>
                        <p id="checkSummary"></p>

                        <h3>Тон письма</h3>
                        <p id="checkTone"></p>

                        <h3>Найденные данные</h3>
                        <ul id="checkData"></ul>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
