<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV & Anschreiben Generator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🇩🇪 Adaptive CV & Anschreiben Generator</h1>
            <p class="subtitle">Für den deutschen Arbeitsmarkt optimiert</p>
        </header>

        <div class="main-content">
            <!-- Master CV Input Section -->
            <section class="input-section">
                <h2>1. Master-CV laden</h2>
                <div class="file-upload">
                    <label for="masterCV" class="upload-label">
                        <span>📄 Master-CV hochladen (JSON)</span>
                        <input type="file" id="masterCV" accept=".json">
                    </label>
                    <button id="loadSample" class="btn-secondary">Beispiel laden</button>
                </div>
                <div id="cvStatus" class="status-message"></div>
            </section>

            <!-- Job Description Input -->
            <section class="input-section">
                <h2>2. Stellenanzeige eingeben</h2>
                <textarea 
                    id="jobDescription" 
                    placeholder="Kopieren Sie hier die vollständige Stellenanzeige..."
                    rows="10"
                ></textarea>
            </section>

            <!-- User Photo Upload -->
            <section class="input-section">
                <h2>3. Bewerbungsfoto (optional)</h2>
                <input type="file" id="userPhoto" accept="image/*">
                <div id="photoPreview"></div>
            </section>

            <!-- Generate Button -->
            <div class="action-section">
                <button id="generateBtn" class="btn-primary">
                    ✨ Dokumente generieren
                </button>
            </div>

            <!-- Output Section -->
            <section id="outputSection" class="output-section" style="display: none;">
                <h2>Generierte Dokumente</h2>
                
                <div class="document-tabs">
                    <button class="tab-btn active" data-tab="anschreiben">Anschreiben</button>
                    <button class="tab-btn" data-tab="lebenslauf">Lebenslauf</button>
                    <button class="tab-btn" data-tab="check">Qualitätsprüfung</button>
                </div>

                <div class="tab-content active" id="anschreiben-tab">
                    <div class="document-actions">
                        <button class="btn-action" id="printAnschreiben">🖨️ Drucken</button>
                        <button class="btn-action" id="downloadAnschreiben">💾 Als HTML speichern</button>
                    </div>
                    <div id="anschreibenPreview" class="document-preview"></div>
                </div>

                <div class="tab-content" id="lebenslauf-tab">
                    <div class="document-actions">
                        <button class="btn-action" id="printLebenslauf">🖨️ Drucken</button>
                        <button class="btn-action" id="downloadLebenslauf">💾 Als HTML speichern</button>
                    </div>
                    <div id="lebenslaufPreview" class="document-preview"></div>
                </div>

                <div class="tab-content" id="check-tab">
                    <div class="quality-check">
                        <h3>Краткое содержание</h3>
                        <p id="checkSummary"></p>
                        
                        <h3>Анализ тона</h3>
                        <p id="checkTone"></p>

                        <h3>Найденные данные</h3>
                        <ul id="checkData"></ul>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <script src="generator.js"></script>
    <script src="app.js"></script>
</body>
</html>
